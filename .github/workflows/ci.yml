name: VelOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verification syntaxique Python
        run: |
          python -m compileall src tests

      - name: Creation des donnees de test CI
        run: |
          python tests/create_ci_data.py

      - name: Construction du modele en etoile
        run: |
          python src/transformation/load_star_schema.py

      - name: Entrainement du modele ML
        run: |
          python src/prediction/train_model.py

      - name: Execution des tests automatises
        run: |
          python -m pytest tests -v

      - name: Construction de l image Docker
        run: |
          docker build -t velops-api:ci .